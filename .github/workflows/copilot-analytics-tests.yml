name: Copilot Analytics Tests

on:
  pull_request:
    paths:
      - '.github/scripts/copilot-analytics/**'
      - '.github/workflows/copilot-analytics*.yml'

permissions:
  contents: read

jobs:
  test:
    name: Pester and PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Preinstalled on Ubuntu 24.04 images; installed when a newer image drops them.
      - name: Ensure Pester 5 and PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }

      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = '.github/scripts/copilot-analytics'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path .github/scripts/copilot-analytics -Recurse `
            -Severity Warning, Error -Settings .github/scripts/copilot-analytics/PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
